<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sushi Seven — Menú a Domicilio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --bg2: #12121a;
      --bg3: #1a1a26;
      --gold: #c9a84c;
      --gold-light: #e8c97a;
      --red: #e63946;
      --text: #f0ede8;
      --text-muted: #8a8599;
      --border: #2a2a3a;
      --card-bg: #13131e;
      --radius: 12px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Montserrat', 'Noto Sans JP', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── HEADER ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10,10,15,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      transition: box-shadow 0.3s;
    }
    header.scrolled { box-shadow: 0 4px 24px rgba(0,0,0,0.5); }

    .logo-wrap {
      display: flex;
      flex-direction: column;
      line-height: 1;
    }
    .logo {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 1.4rem;
      letter-spacing: 0.12em;
      color: var(--gold);
      text-transform: uppercase;
    }
    .logo span { color: var(--red); }
    .tagline {
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 2px;
    }

    .cart-btn {
      position: relative;
      background: none;
      border: 1.5px solid var(--gold);
      color: var(--gold);
      border-radius: 50px;
      padding: 8px 18px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s, color 0.2s;
    }
    .cart-btn:hover { background: var(--gold); color: #000; }
    .cart-count {
      background: var(--red);
      color: #fff;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: none;
      transition: transform 0.2s;
    }
    .cart-count.bounce { animation: bounce 0.4s ease; }
    @keyframes bounce {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.5); }
      60%  { transform: scale(0.9); }
      100% { transform: scale(1); }
    }

    /* ── HERO ── */
    .hero {
      position: relative;
      height: 200px;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      padding: 24px 20px;
    }
    .hero-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.35;
    }
    .hero-fallback {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #1a0a2e 0%, #0d1a2e 50%, #1a0d0d 100%);
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, var(--bg) 0%, transparent 60%);
    }
    .hero-text { position: relative; z-index: 1; }
    .hero-text h2 {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--text);
    }
    .hero-text h2 em {
      font-style: normal;
      color: var(--gold);
    }
    .hero-text p {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 4px;
      letter-spacing: 0.06em;
    }

    /* ── CATEGORY BAR ── */
    .cat-bar-wrap {
      position: sticky;
      top: 64px;
      z-index: 90;
      background: rgba(10,10,15,0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .cat-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 16px;
      scrollbar-width: none;
    }
    .cat-bar::-webkit-scrollbar { display: none; }
    .cat-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 50px;
      padding: 6px 16px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.03em;
    }
    .cat-btn:hover { border-color: var(--gold); color: var(--gold); }
    .cat-btn.active {
      background: var(--gold);
      border-color: var(--gold);
      color: #000;
    }

    /* ── MAIN CONTENT ── */
    main { padding: 24px 16px 120px; max-width: 900px; margin: 0 auto; }

    .section { margin-bottom: 48px; opacity: 0; transform: translateY(20px); transition: opacity 0.5s ease, transform 0.5s ease; }
    .section.visible { opacity: 1; transform: translateY(0); }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, var(--gold), transparent);
      opacity: 0.4;
    }

    .products-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    @media (min-width: 480px) { .products-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 768px) { .products-grid { grid-template-columns: repeat(3, 1fr); } }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
    }
    .product-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(to right, var(--gold), var(--red));
      opacity: 0;
      transition: opacity 0.2s;
    }
    .product-card:hover {
      border-color: var(--gold);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(201,168,76,0.1);
    }
    .product-card:hover::before { opacity: 1; }

    .product-name {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }
    .product-desc {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 300;
      line-height: 1.5;
      flex: 1;
    }
    .product-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
    }
    .product-price {
      font-size: 1rem;
      font-weight: 700;
      color: var(--gold-light);
    }
    .product-price span { font-size: 0.7rem; opacity: 0.7; }

    .add-btn {
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.15s;
      flex-shrink: 0;
    }
    .add-btn:hover { background: #ff5563; transform: scale(1.1); }
    .add-btn:active { transform: scale(0.95); }

    /* ── CART OVERLAY ── */
    .cart-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .cart-overlay.open { opacity: 1; pointer-events: all; }

    .cart-drawer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg2);
      border-top: 1px solid var(--border);
      border-radius: 24px 24px 0 0;
      z-index: 210;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
    }
    @media (min-width: 640px) {
      .cart-drawer {
        left: auto;
        right: 0;
        top: 0;
        bottom: 0;
        width: 400px;
        border-radius: 0;
        border-left: 1px solid var(--border);
        border-top: none;
        max-height: 100vh;
        transform: translateX(100%);
        transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
      }
    }
    .cart-drawer.open {
      transform: translateY(0);
    }
    @media (min-width: 640px) {
      .cart-drawer.open { transform: translateX(0); }
    }

    .cart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
    }
    .cart-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.05em;
    }
    .cart-close {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .cart-close:hover { border-color: var(--red); color: var(--red); }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .cart-empty {
      text-align: center;
      color: var(--text-muted);
      padding: 40px 0;
      font-size: 0.85rem;
    }
    .cart-empty .emoji { font-size: 2.5rem; display: block; margin-bottom: 12px; }

    .cart-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .cart-item:last-child { border-bottom: none; }
    .cart-item-info { flex: 1; min-width: 0; }
    .cart-item-name { font-size: 0.82rem; font-weight: 600; color: var(--text); }
    .cart-item-price { font-size: 0.78rem; color: var(--gold); margin-top: 2px; }

    .qty-ctrl {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg3);
      border-radius: 50px;
      padding: 4px 4px;
    }
    .qty-btn {
      background: none;
      border: none;
      color: var(--text);
      width: 26px;
      height: 26px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .qty-btn:hover { background: var(--border); }
    .qty-num { font-size: 0.85rem; font-weight: 700; min-width: 20px; text-align: center; }

    .cart-footer {
      padding: 16px 20px 24px;
      border-top: 1px solid var(--border);
      background: var(--bg2);
    }
    .cart-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .cart-total-label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
    .cart-total-amount { font-size: 1.4rem; font-weight: 900; color: var(--gold); }

    .whatsapp-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #25d366, #128c7e);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-family: 'Montserrat', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.15s;
      letter-spacing: 0.03em;
    }
    .whatsapp-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .whatsapp-btn:active { transform: translateY(0); }
    .whatsapp-btn svg { width: 22px; height: 22px; fill: #fff; }
    .whatsapp-btn.disabled {
      background: var(--bg3);
      color: var(--text-muted);
      cursor: not-allowed;
      transform: none;
    }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--bg3);
      border: 1px solid var(--gold);
      color: var(--text);
      padding: 10px 20px;
      border-radius: 50px;
      font-size: 0.82rem;
      font-weight: 600;
      z-index: 300;
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      white-space: nowrap;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 6px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── FADE IN GLOBAL ── */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.6s ease forwards; }
  </style>
</head>

  <!-- HEADER -->

    <div class="logo-wrap">

      <div class="tagline">Menú a Domicilio</div>

  <!-- HERO -->
  <div class="hero">

    <div class="hero-text fade-in">

      ],
      "Postres": [
        {nombre:"Mochi de Helado", desc:"Helado envuelto en mochi. Sabores: fresa, vainilla, mango. 3 piezas", precio:98},
        {nombre:"Tempura de Plátano", desc:"Plátano en tempura con helado de vainilla", precio:118},
        {nombre:"Cheesecake Japonés", desc:"Cheesecake esponjoso estilo japonés", precio:128},
      ],
      "Bebidas": [
        {nombre:"Agua Natural", desc:"600ml", precio:35},
        {nombre:"Refresco", desc:"355ml lata", precio:45},
        {nombre:"Té Helado Japonés", desc:"Té verde o negro. 500ml", precio:65},
        {nombre:"Agua de Coco", desc:"Natural. 330ml", precio:75},
      ]
    };

    // ── CART STATE ──
    const cart = {};

    // ── BUILD UI ──
    const catBar = document.getElementById('catBar');
    const menuMain = document.getElementById('menuMain');
    const categories = Object.keys(MENU);

    // Category buttons
    categories.forEach((cat, i) => {
      const btn = document.createElement('button');
      btn.className = 'cat-btn' + (i === 0 ? ' active' : '');
      btn.textContent = cat;
      btn.dataset.cat = cat;
      btn.addEventListener('click', () => {
        document.getElementById('sec-' + slugify(cat))?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        setActiveCategory(cat);
      });
      catBar.appendChild(btn);
    });

    // Menu sections
    categories.forEach(cat => {
      const section = document.createElement('section');
      section.className = 'section';
      section.id = 'sec-' + slugify(cat);
      section.dataset.cat = cat;

      const title = document.createElement('h2');
      title.className = 'section-title';
      title.textContent = cat;
      section.appendChild(title);

      const grid = document.createElement('div');
      grid.className = 'products-grid';

      MENU[cat].forEach(item => {
        const key = slugify(item.nombre);
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <div class="product-name">${item.nombre}</div>
          <div class="product-desc">${item.desc}</div>
          <div class="product-footer">
            <div class="product-price"><span>$</span>${item.precio}</div>
            <button class="add-btn" data-key="${key}" data-nombre="${escapeAttr(item.nombre)}" data-precio="${item.precio}" aria-label="Agregar ${item.nombre}">+</button>
          </div>
        `;
        grid.appendChild(card);
      });

      section.appendChild(grid);
      menuMain.appendChild(section);
    });

    // Add to cart listeners
    document.querySelectorAll('.add-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.key;
        const nombre = btn.dataset.nombre;
        const precio = parseInt(btn.dataset.precio, 10);
        addToCart(key, nombre, precio);
      });
    });

    // ── CART LOGIC ──
    function addToCart(key, nombre, precio) {
      if (cart[key]) {
        cart[key].qty++;
      } else {
        cart[key] = { nombre, precio, qty: 1 };
      }
      updateCart();
      showToast('✓ ' + nombre + ' agregado');
      triggerCartBounce();
    }

    function updateCart() {
      const count = Object.values(cart).reduce((s, i) => s + i.qty, 0);
      const total = Object.values(cart).reduce((s, i) => s + i.precio * i.qty, 0);

      document.getElementById('cartCount').textContent = count;
      document.getElementById('cartTotal').textContent = '$' + total.toLocaleString('es-MX');

      const itemsEl = document.getElementById('cartItems');
      const waBtn = document.getElementById('whatsappBtn');

      if (count === 0) {
        itemsEl.innerHTML = '<div class="cart-empty"><span class="emoji">🍱</span>Tu carrito está vacío</div>';
        waBtn.href = '#';
        waBtn.className = 'whatsapp-btn disabled';
        waBtn.onclick = (e) => e.preventDefault();
        return;
      }

      itemsEl.innerHTML = '';
      Object.entries(cart).forEach(([key, item]) => {
        const div = document.createElement('div');
        div.className = 'cart-item';
        div.innerHTML = `
          <div class="cart-item-info">
            <div class="cart-item-name">${item.nombre}</div>
            <div class="cart-item-price">$${(item.precio * item.qty).toLocaleString('es-MX')}</div>
          </div>
          <div class="qty-ctrl">
            <button class="qty-btn" data-key="${key}" data-action="minus">−</button>
            <span class="qty-num">${item.qty}</span>
            <button class="qty-btn" data-key="${key}" data-action="plus">+</button>
          </div>
        `;
        itemsEl.appendChild(div);
      });

      itemsEl.querySelectorAll('.qty-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const key = btn.dataset.key;
          if (btn.dataset.action === 'plus') {
            cart[key].qty++;
          } else {
            cart[key].qty--;
            if (cart[key].qty <= 0) delete cart[key];
          }
          updateCart();
        });
      });

      // Build WhatsApp URL
      const lines = Object.values(cart).map(i => `${i.qty}x ${i.nombre} ($${i.precio * i.qty})`).join('%0A');
      const totalText = '$' + total.toLocaleString('es-MX');
      const msg = `Hola+Sushi+Seven+quiero+ordenar:%0A${encodeURIComponent(Object.values(cart).map(i => `${i.qty}x ${i.nombre} ($${i.precio * i.qty})`).join('\n'))}%0ATotal:+${encodeURIComponent(totalText)}`;
      waBtn.href = `https://wa.me/5212271132851?text=${msg}`;
      waBtn.className = 'whatsapp-btn';
      waBtn.onclick = null;
    }

    // ── CART DRAWER ──
    const cartOverlay = document.getElementById('cartOverlay');
    const cartDrawer = document.getElementById('cartDrawer');

    function openCart() {
      cartOverlay.classList.add('open');
      cartDrawer.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeCart() {
      cartOverlay.classList.remove('open');
      cartDrawer.classList.remove('open');
      document.body.style.overflow = '';
    }

    document.getElementById('cartToggle').addEventListener('click', openCart);
    document.getElementById('cartClose').addEventListener('click', closeCart);
    cartOverlay.addEventListener('click', closeCart);

    // ── HEADER SCROLL ──
    window.addEventListener('scroll', () => {
      document.getElementById('mainHeader').classList.toggle('scrolled', window.scrollY > 10);
    }, { passive: true });

    // ── INTERSECTION OBSERVER (active category) ──
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const cat = entry.target.dataset.cat;
          setActiveCategory(cat);
          // Also trigger section fade-in
          entry.target.classList.add('visible');
        }
      });
    }, { rootMargin: '-100px 0px -60% 0px', threshold: 0 });

    document.querySelectorAll('.section').forEach(sec => observer.observe(sec));

    function setActiveCategory(cat) {
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.cat === cat);
      });
      // Scroll active cat button into view
      const activeBtn = catBar.querySelector('.cat-btn.active');
      if (activeBtn) activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }

    // ── TOAST ──
    let toastTimer;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // ── CART BOUNCE ──
    function triggerCartBounce() {
      const el = document.getElementById('cartCount');
      el.classList.remove('bounce');
      void el.offsetWidth; // reflow
      el.classList.add('bounce');
    }

    // ── HELPER FUNCTIONS ──
    function slugify(str) {
      return str.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    }
    function escapeAttr(str) {
      return str.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // ── INIT ──
    updateCart();

    // Trigger first section visible immediately
    document.querySelectorAll('.section').forEach((sec, i) => {
      if (i < 3) setTimeout(() => sec.classList.add('visible'), i * 100);
    });
  </script>
</body>
</html>
